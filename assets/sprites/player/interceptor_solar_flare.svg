  <path d="M16 40 L22 40 L22 64 L16 64 Z" fill="#4a2a0a" stroke="#ff8800" stroke-width="0.5"/>
  <path d="M42 40 L48 40 L48 64 L42 64 Z" fill="#4a2a0a" stroke="#ff8800" stroke-width="0.5"/>

  <!-- Side weapon mounts -->
  <rect x="14" y="44" width="6" height="8" rx="1" fill="#5a3a10" stroke="#ffcc00" stroke-width="0.6"/>
  <circle cx="17" cy="48" r="2" fill="#ff4400" opacity="0.9"/>
  <rect x="44" y="44" width="6" height="8" rx="1" fill="#5a3a10" stroke="#ffcc00" stroke-width="0.6"/>
  <circle cx="47" cy="48" r="2" fill="#ff4400" opacity="0.9"/>

  <!-- Engine exhaust grilles -->
  <rect x="24" y="72" width="6" height="4" rx="1" fill="#3a2a0a" stroke="#ff8800" stroke-width="0.6"/>
  <rect x="34" y="72" width="6" height="4" rx="1" fill="#3a2a0a" stroke="#ff8800" stroke-width="0.6"/>

