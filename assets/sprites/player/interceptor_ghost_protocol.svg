<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <!-- Ghost Protocol: Stealth Matte Black with Ice-Cyan Digital Camo & Red Accents -->
  <path d="M32 4 L44 12 L48 24 L50 40 L50 64 L48 76 L44 84 L32 92 L20 84 L16 76 L14 64 L14 40 L16 24 L20 12 Z" fill="#0d1014" stroke="#66e0ff" stroke-width="1.5"/>

  <!-- Digital camo block pattern -->
  <rect x="20" y="12" width="6" height="4" fill="#1a222c"/>
  <rect x="30" y="10" width="8" height="5" fill="#2a3442"/>
  <rect x="40" y="14" width="5" height="4" fill="#1a222c"/>
  <rect x="16" y="22" width="8" height="6" fill="#2a3442"/>
  <rect x="32" y="20" width="10" height="6" fill="#1a222c"/>
  <rect x="24" y="32" width="6" height="5" fill="#2a3442"/>
  <rect x="38" y="30" width="8" height="6" fill="#1a222c"/>
  <rect x="18" y="44" width="8" height="6" fill="#2a3442"/>
  <rect x="36" y="42" width="10" height="6" fill="#1a222c"/>
  <rect x="22" y="56" width="8" height="5" fill="#2a3442"/>
  <rect x="38" y="54" width="8" height="6" fill="#1a222c"/>
  <rect x="20" y="68" width="8" height="6" fill="#2a3442"/>
  <rect x="36" y="66" width="10" height="6" fill="#1a222c"/>
  <rect x="26" y="78" width="12" height="5" fill="#2a3442"/>

  <!-- Front armor wedge -->
  <path d="M32 8 L40 14 L42 22 L32 26 L22 22 L24 14 Z" fill="#1a222c" stroke="#66e0ff" stroke-width="0.6"/>

  <!-- Cockpit canopy (stealth smoked) -->
  <path d="M26 28 L38 28 L40 36 L32 40 L24 36 Z" fill="#05080c" stroke="#66e0ff" stroke-width="1"/>
  <path d="M28 30 L36 30 L37 34 L32 36 L27 34 Z" fill="#66e0ff" opacity="0.2"/>

  <!-- Central weapons spine -->
  <rect x="30" y="42" width="4" height="20" rx="1" fill="#1a222c" stroke="#ff2a55" stroke-width="0.6"/>

  <!-- Side armor panels -->
  <path d="M16 40 L22 40 L22 64 L16 64 Z" fill="#141a22" stroke="#66e0ff" stroke-width="0.5"/>
  <path d="M42 40 L48 40 L48 64 L42 64 Z" fill="#141a22" stroke="#66e0ff" stroke-width="0.5"/>

  <!-- Side weapon mounts -->
  <rect x="14" y="44" width="6" height="8" rx="1" fill="#1a222c" stroke="#ff2a55" stroke-width="0.6"/>
  <circle cx="17" cy="48" r="2" fill="#ff2a55" opacity="0.9"/>
  <rect x="44" y="44" width="6" height="8" rx="1" fill="#1a222c" stroke="#ff2a55" stroke-width="0.6"/>
  <circle cx="47" cy="48" r="2" fill="#ff2a55" opacity="0.9"/>

  <!-- Engine exhaust grilles -->
  <rect x="24" y="72" width="6" height="4" rx="1" fill="#0d1014" stroke="#66e0ff" stroke-width="0.5"/>
  <rect x="34" y="72" width="6" height="4" rx="1" fill="#0d1014" stroke="#66e0ff" stroke-width="0.5"/>

  <!-- Rear thruster housing -->
  <path d="M22 80 L32 86 L42 80 L40 76 L32 80 L24 76 Z" fill="#1a222c" stroke="#66e0ff" stroke-width="1"/>

  <!-- Front targeting sensors -->
  <circle cx="28" cy="18" r="1.5" fill="#ff2a55" opacity="0.9"/>
  <circle cx="36" cy="18" r="1.5" fill="#ff2a55" opacity="0.9"/>

  <!-- Side running lights -->
  <circle cx="16" cy="32" r="1.3" fill="#66e0ff" opacity="0.75"/>
  <circle cx="48" cy="32" r="1.3" fill="#66e0ff" opacity="0.75"/>

  <!-- Subdued afterburner -->
  <path d="M26 86 L28 92 L30 86 Z" fill="#66e0ff" opacity="0.7"/>
  <path d="M34 86 L36 92 L38 86 Z" fill="#66e0ff" opacity="0.7"/>
</svg>
