  <!-- Front armor wedge -->
  <path d="M32 8 L40 14 L42 22 L32 26 L22 22 L24 14 Z" fill="#2a3a4a" stroke="#00ffcc" stroke-width="0.5"/>
  
  <!-- Cockpit canopy -->
  <path d="M26 28 L38 28 L40 36 L32 40 L24 36 Z" fill="#0a1a2a" stroke="#00ffcc" stroke-width="1"/>
  <path d="M28 30 L36 30 L37 34 L32 36 L27 34 Z" fill="#00ffcc" opacity="0.15"/>
  
  <!-- Central weapons spine -->
  <rect x="30" y="42" width="4" height="20" rx="1" fill="#3a4a5a" stroke="#ff6600" stroke-width="0.5"/>
  
  <!-- Side armor panels -->
  <path d="M16 40 L22 40 L22 64 L16 64 Z" fill="#2a3a4a" stroke="#00ffcc" stroke-width="0.5"/>
  <path d="M42 40 L48 40 L48 64 L42 64 Z" fill="#2a3a4a" stroke="#00ffcc" stroke-width="0.5"/>
  
  <!-- Left weapon mount -->
  <rect x="14" y="44" width="6" height="8" rx="1" fill="#3a4a5a" stroke="#ff6600" stroke-width="0.5"/>
  <circle cx="17" cy="48" r="2" fill="#ff6600" opacity="0.6"/>
  
  <!-- Right weapon mount -->
  <rect x="44" y="44" width="6" height="8" rx="1" fill="#3a4a5a" stroke="#ff6600" stroke-width="0.5"/>
  <circle cx="47" cy="48" r="2" fill="#ff6600" opacity="0.6"/>
  
  <!-- Engine exhaust grilles -->
  <rect x="24" y="72" width="6" height="4" rx="1" fill="#1a2a3a" stroke="#ff3300" stroke-width="0.5"/>
  <rect x="34" y="72" width="6" height="4" rx="1" fill="#1a2a3a" stroke="#ff3300" stroke-width="0.5"/>
  
  <!-- Rear thruster housing -->
  <path d="M22 80 L32 86 L42 80 L40 76 L32 80 L24 76 Z" fill="#2a3a4a" stroke="#ff3300" stroke-width="1"/>
  
  <!-- Neon accent lines -->
  <line x1="20" y1="50" x2="20" y2="60" stroke="#00ffcc" stroke-width="1" opacity="0.8"/>
  <line x1="44" y1="50" x2="44" y2="60" stroke="#00ffcc" stroke-width="1" opacity="0.8"/>
  
  <!-- Front targeting sensors -->
  <circle cx="28" cy="18" r="2" fill="#ff0066" opacity="0.8"/>
  <circle cx="36" cy="18" r="2" fill="#ff0066" opacity="0.8"/>
  
  <!-- Side running lights -->
  <circle cx="16" cy="32" r="1.5" fill="#00ffcc" opacity="0.7"/>
  <circle cx="48" cy="32" r="1.5" fill="#00ffcc" opacity="0.7"/>
  
  <!-- Armor rivets -->
  <circle cx="24" cy="44" r="0.8" fill="#4a5a6a"/>
  <circle cx="40" cy="44" r="0.8" fill="#4a5a6a"/>
  <circle cx="24" cy="60" r="0.8" fill="#4a5a6a"/>
  <circle cx="40" cy="60" r="0.8" fill="#4a5a6a"/>
  
  <!-- Exhaust flames -->
  <path d="M26 86 L28 92 L30 86 Z" fill="#ff6600" opacity="0.6"/>
  <path d="M34 86 L36 92 L38 86 Z" fill="#ff6600" opacity="0.6"/>
