<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <!-- Toxic Volt: Matte Charcoal & Acid Lime / Yellow Hazard Chevrons -->
  <path d="M32 4 L44 12 L48 24 L50 40 L50 64 L48 76 L44 84 L32 92 L20 84 L16 76 L14 64 L14 40 L16 24 L20 12 Z" fill="#161b18" stroke="#99ff00" stroke-width="1.5"/>

  <!-- Front armor wedge -->
