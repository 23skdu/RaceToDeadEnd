name: "Dependabot & Dependency Updates"

on:
  pull_request:
    branches:
      - main
  schedule:
    - cron: "0 10 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  dependabot-pr:
    name: Handle Dependabot PR
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot Metadata
        id: metadata
        uses: dependabot/fetch-metadata@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Auto-Approve Minor & Patch Updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-toolchain-deps:
    name: Check Godot, GUT & Script Dependencies
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Check Upstream Godot, GUT & coi-serviceworker Versions
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import urllib.request

          def fetch_json(url):
              req = urllib.request.Request(url, headers={"Accept": "application/vnd.github+json"})
              token = os.environ.get("GH_TOKEN")
              if token:
                  req.add_header("Authorization", f"Bearer {token}")
              with urllib.request.urlopen(req, timeout=20) as resp:
                  return json.load(resp)

          godot_tag = fetch_json("https://api.github.com/repos/godotengine/godot/releases/latest")["tag_name"]
          godot_ver = godot_tag.replace("-stable", "")
          gut_tag = fetch_json("https://api.github.com/repos/bitwes/Gut/releases/latest")["tag_name"]
          gut_ver = gut_tag.lstrip("v")
          coi_sha = fetch_json("https://api.github.com/repos/gzuidhof/coi-serviceworker/commits/master")["sha"]

          print(f"Latest Godot: {godot_ver}, GUT: {gut_ver}, coi-serviceworker: {coi_sha}")

          changed = False

          def update_file(path, replacements):
              global changed
              with open(path, "r", encoding="utf-8") as f:
                  content = f.read()
              new_content = content
              for pattern, repl in replacements:
                  new_content = re.sub(pattern, repl, new_content, flags=re.MULTILINE)
              if new_content != content:
                  with open(path, "w", encoding="utf-8") as f:
                      f.write(new_content)
                  changed = True

          update_file(".github/workflows/build-and-publish.yml", [
              (r'^(  GODOT_VERSION:\s*)"[^"]+"', rf'\1"{godot_ver}"'),
              (r'^(  GUT_VERSION:\s*)"[^"]+"', rf'\1"{gut_ver}"'),
              (r'^(  COI_SW_SHA:\s*)"[^"]+"', rf'\1"{coi_sha}"'),
          ])

          update_file("Makefile", [
              (r'^(GODOT_VERSION\s*\?=\s*).*$', rf'\g<1>{godot_ver}'),
              (r'^(GUT_VERSION\s*\?=\s*).*$', rf'\g<1>{gut_ver}'),
              (r'^(COI_SW_SHA\s*\?=\s*).*$', rf'\g<1>{coi_sha}'),
          ])

          godot_minor = ".".join(godot_ver.split(".")[:2])
          update_file("project.godot", [
              (r'^(config/features=PackedStringArray\()"[^"]+"(\))', rf'\1"{godot_minor}"\2'),
          ])

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"changed={'true' if changed else 'false'}\n")
              out.write(f"godot_ver={godot_ver}\n")
              out.write(f"gut_ver={gut_ver}\n")
          PY

      - name: Create Pull Request for Updated Dependencies
        if: steps.check.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: "chore(deps): update Godot/GUT/coi-serviceworker toolchain pins"
          branch: "dependabot/toolchain-updates"
          delete-branch: true
          title: "chore(deps): update Godot (${{ steps.check.outputs.godot_ver }}) and test/web script dependencies"
          body: |
            Automated weekly dependency check:
            - Godot: `${{ steps.check.outputs.godot_ver }}`
            - GUT: `${{ steps.check.outputs.gut_ver }}`
            - `coi-serviceworker.js` SHA pinned from `gzuidhof/coi-serviceworker`
          labels: |
            dependencies
            automated
