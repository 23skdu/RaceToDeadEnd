  <path d="M23 73 L32 68 L41 73 L41 75.5 L32 70.5 L23 75.5 Z" fill="#99ff00" opacity="0.8"/>

  <!-- Hexagonal cyber armor grid lines -->
  <polygon points="32,42 38,46 38,54 32,58 26,54 26,46" fill="#1e2720" stroke="#99ff00" stroke-width="0.8" opacity="0.9"/>

  <!-- Cockpit canopy -->
