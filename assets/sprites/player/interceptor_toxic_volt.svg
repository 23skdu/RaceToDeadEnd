  <path d="M23 18 L32 13 L41 18 L41 21 L32 16 L23 21 Z" fill="#ffee00" opacity="0.9"/>
  <path d="M21 24 L32 19 L43 24 L43 26.5 L32 21.5 L21 26.5 Z" fill="#99ff00" opacity="0.85"/>

