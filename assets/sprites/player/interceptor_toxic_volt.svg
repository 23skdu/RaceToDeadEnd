  <path d="M28 30 L36 30 L37 34 L32 36 L27 34 Z" fill="#99ff00" opacity="0.4"/>

  <!-- Central weapons spine -->
  <rect x="30" y="42" width="4" height="18" rx="1" fill="#2b362d" stroke="#ffee00" stroke-width="0.6"/>

  <!-- Side armor panels -->
  <path d="M16 40 L22 40 L22 64 L16 64 Z" fill="#222a23" stroke="#99ff00" stroke-width="0.6"/>
  <path d="M42 40 L48 40 L48 64 L42 64 Z" fill="#222a23" stroke="#99ff00" stroke-width="0.6"/>

  <!-- Side weapon mounts -->
  <rect x="14" y="44" width="6" height="8" rx="1" fill="#2b362d" stroke="#ffee00" stroke-width="0.6"/>
  <circle cx="17" cy="48" r="2" fill="#99ff00" opacity="0.9"/>
  <rect x="44" y="44" width="6" height="8" rx="1" fill="#2b362d" stroke="#ffee00" stroke-width="0.6"/>
  <circle cx="47" cy="48" r="2" fill="#99ff00" opacity="0.9"/>

  <!-- Engine exhaust grilles -->
  <rect x="24" y="74" width="6" height="4" rx="1" fill="#161b18" stroke="#99ff00" stroke-width="0.5"/>
  <rect x="34" y="74" width="6" height="4" rx="1" fill="#161b18" stroke="#99ff00" stroke-width="0.5"/>

  <!-- Rear thruster housing -->
