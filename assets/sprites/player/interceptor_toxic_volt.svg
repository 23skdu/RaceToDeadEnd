  <!-- Front targeting sensors -->
  <circle cx="28" cy="18" r="1.5" fill="#99ff00" opacity="0.9"/>
  <circle cx="36" cy="18" r="1.5" fill="#99ff00" opacity="0.9"/>

  <!-- Side running lights -->
  <circle cx="16" cy="32" r="1.5" fill="#ffee00" opacity="0.85"/>
  <circle cx="48" cy="32" r="1.5" fill="#ffee00" opacity="0.85"/>

  <!-- Exhaust flames -->
  <path d="M26 86 L28 93 L30 86 Z" fill="#99ff00" opacity="0.85"/>
  <path d="M34 86 L36 93 L38 86 Z" fill="#99ff00" opacity="0.85"/>
