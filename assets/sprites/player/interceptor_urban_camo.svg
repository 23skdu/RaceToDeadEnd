<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <!-- Urban Camo (Special Unlockable): Tactical Urban Splinter & Digital Camouflage -->
  <path d="M32 4 L44 12 L48 24 L50 40 L50 64 L48 76 L44 84 L32 92 L20 84 L16 76 L14 64 L14 40 L16 24 L20 12 Z" fill="#2b3038" stroke="#9aa5b4" stroke-width="1.5"/>

  <!-- Urban splinter camouflage polygons -->
  <polygon points="32,6 42,13 36,23 24,18" fill="#525a66"/>
  <polygon points="20,14 28,19 22,30 16,25" fill="#8b94a3"/>
  <polygon points="44,14 47,26 39,28 36,19" fill="#1d2127"/>
  <polygon points="15,30 25,28 24,42 15,44" fill="#6b7482"/>
  <polygon points="40,29 48,31 49,45 38,42" fill="#b4becb"/>
  <polygon points="24,41 39,41 42,56 22,53" fill="#414854"/>
  <polygon points="15,47 23,51 21,67 15,63" fill="#1d2127"/>
  <polygon points="41,49 49,47 49,64 41,66" fill="#5e6775"/>
  <polygon points="22,56 35,58 31,73 19,70" fill="#9ea8b6"/>
  <polygon points="35,59 45,62 43,75 32,74" fill="#20242b"/>
  <polygon points="22,72 32,74 42,73 38,83 32,88 26,83" fill="#596270"/>

  <!-- Digital camo micro-blocks -->
  <rect x="26" y="12" width="4" height="3" fill="#c2cad6" opacity="0.8"/>
  <rect x="35" y="16" width="4" height="3" fill="#1d2127" opacity="0.8"/>
  <rect x="20" y="57" width="4" height="4" fill="#c2cad6" opacity="0.75"/>
  <rect x="38" y="54" width="4" height="4" fill="#1d2127" opacity="0.8"/>
  <rect x="29" y="66" width="6" height="3" fill="#1d2127" opacity="0.85"/>

  <!-- Cockpit canopy (stealth smoked glass with ice-cyan trim) -->
  <path d="M26 28 L38 28 L40 36 L32 40 L24 36 Z" fill="#10151c" stroke="#66e0ff" stroke-width="1"/>
  <path d="M28 30 L36 30 L37 34 L32 36 L27 34 Z" fill="#66e0ff" opacity="0.25"/>

  <!-- Tactical central weapons spine -->
  <rect x="30" y="42" width="4" height="20" rx="1" fill="#2b3038" stroke="#9aa5b4" stroke-width="0.6"/>

  <!-- Side weapon mounts -->
  <rect x="14" y="44" width="6" height="8" rx="1" fill="#2b3038" stroke="#66e0ff" stroke-width="0.6"/>
  <circle cx="17" cy="48" r="1.8" fill="#66e0ff" opacity="0.8"/>
  <rect x="44" y="44" width="6" height="8" rx="1" fill="#2b3038" stroke="#66e0ff" stroke-width="0.6"/>
  <circle cx="47" cy="48" r="1.8" fill="#66e0ff" opacity="0.8"/>

  <!-- Engine exhaust grilles -->
  <rect x="24" y="72" width="6" height="4" rx="1" fill="#1a1e24" stroke="#66e0ff" stroke-width="0.5"/>
  <rect x="34" y="72" width="6" height="4" rx="1" fill="#1a1e24" stroke="#66e0ff" stroke-width="0.5"/>

  <!-- Rear thruster housing -->
  <path d="M22 80 L32 86 L42 80 L40 76 L32 80 L24 76 Z" fill="#2b3038" stroke="#9aa5b4" stroke-width="1"/>

  <!-- Tactical targeting sensors -->
  <circle cx="28" cy="18" r="1.5" fill="#66e0ff" opacity="0.85"/>
  <circle cx="36" cy="18" r="1.5" fill="#66e0ff" opacity="0.85"/>

  <!-- Side running lights -->
  <circle cx="16" cy="32" r="1.3" fill="#66e0ff" opacity="0.75"/>
  <circle cx="48" cy="32" r="1.3" fill="#66e0ff" opacity="0.75"/>

  <!-- Subdued tactical afterburner -->
  <path d="M26 86 L28 92 L30 86 Z" fill="#66e0ff" opacity="0.7"/>
  <path d="M34 86 L36 92 L38 86 Z" fill="#66e0ff" opacity="0.7"/>
