<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <!-- Crimson Viper: Obsidian & Scarlet with Twin Gold/Crimson Racing Stripes -->
  <path d="M32 4 L44 12 L48 24 L50 40 L50 64 L48 76 L44 84 L32 92 L20 84 L16 76 L14 64 L14 40 L16 24 L20 12 Z" fill="#1c090e" stroke="#ff1e42" stroke-width="1.5"/>

  <!-- Front armor wedge -->
  <path d="M32 8 L40 14 L42 22 L32 26 L22 22 L24 14 Z" fill="#3a0d18" stroke="#ff1e42" stroke-width="0.6"/>

  <!-- Twin racing stripes -->
  <path d="M27 10 L30 10 L30 82 L27 80 Z" fill="#ff1e42" opacity="0.9"/>
  <path d="M34 10 L37 10 L37 80 L34 82 Z" fill="#ff1e42" opacity="0.9"/>
  <path d="M25.5 14 L26.5 14 L26.5 78 L25.5 77 Z" fill="#ffcc33" opacity="0.85"/>
  <path d="M37.5 14 L38.5 14 L38.5 77 L37.5 78 Z" fill="#ffcc33" opacity="0.85"/>

  <!-- Cockpit canopy -->
  <path d="M26 28 L38 28 L40 36 L32 40 L24 36 Z" fill="#120408" stroke="#ffcc33" stroke-width="1"/>
  <path d="M28 30 L36 30 L37 34 L32 36 L27 34 Z" fill="#ff1e42" opacity="0.45"/>

  <!-- Central weapons spine -->
  <rect x="30" y="42" width="4" height="22" rx="1" fill="#4a1420" stroke="#ffcc33" stroke-width="0.6"/>

  <!-- Side armor panels with scarlet trim -->
  <path d="M16 40 L22 40 L22 64 L16 64 Z" fill="#2e0c15" stroke="#ff1e42" stroke-width="0.6"/>
  <path d="M42 40 L48 40 L48 64 L42 64 Z" fill="#2e0c15" stroke="#ff1e42" stroke-width="0.6"/>

  <!-- Side weapon mounts -->
  <rect x="14" y="44" width="6" height="8" rx="1" fill="#3a121b" stroke="#ffcc33" stroke-width="0.6"/>
  <circle cx="17" cy="48" r="2" fill="#ffcc33" opacity="0.85"/>
  <rect x="44" y="44" width="6" height="8" rx="1" fill="#3a121b" stroke="#ffcc33" stroke-width="0.6"/>
  <circle cx="47" cy="48" r="2" fill="#ffcc33" opacity="0.85"/>

  <!-- Hood intake vents -->
  <line x1="20" y1="22" x2="25" y2="25" stroke="#ffcc33" stroke-width="1"/>
  <line x1="44" y1="22" x2="39" y2="25" stroke="#ffcc33" stroke-width="1"/>

  <!-- Engine exhaust grilles -->
  <rect x="24" y="72" width="6" height="4" rx="1" fill="#1c090e" stroke="#ff4400" stroke-width="0.6"/>
  <rect x="34" y="72" width="6" height="4" rx="1" fill="#1c090e" stroke="#ff4400" stroke-width="0.6"/>

  <!-- Rear thruster housing -->
  <path d="M22 80 L32 86 L42 80 L40 76 L32 80 L24 76 Z" fill="#3a0d18" stroke="#ffcc33" stroke-width="1"/>

  <!-- Front targeting sensors -->
  <circle cx="28" cy="18" r="1.8" fill="#ffcc33" opacity="0.9"/>
  <circle cx="36" cy="18" r="1.8" fill="#ffcc33" opacity="0.9"/>

  <!-- Side running lights -->
  <circle cx="16" cy="32" r="1.5" fill="#ff1e42" opacity="0.9"/>
  <circle cx="48" cy="32" r="1.5" fill="#ff1e42" opacity="0.9"/>

  <!-- Exhaust flames -->
  <path d="M26 86 L28 93 L30 86 Z" fill="#ff3300" opacity="0.85"/>
  <path d="M34 86 L36 93 L38 86 Z" fill="#ff3300" opacity="0.85"/>
</svg>
