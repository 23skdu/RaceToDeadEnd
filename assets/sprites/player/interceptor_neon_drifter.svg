<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <!-- Neon Drifter: Dark Teal with Magenta/Cyan Neon Glow Trails -->
  <path d="M32 4 L44 12 L48 24 L50 40 L50 64 L48 76 L44 84 L32 92 L20 84 L16 76 L14 64 L14 40 L16 24 L20 12 Z" fill="#0a1a1e" stroke="#00f0ff" stroke-width="1.5"/>

  <!-- Neon drift trail lines -->
  <path d="M14 40 Q8 56 14 72" fill="none" stroke="#ff00aa" stroke-width="1.5" opacity="0.8"/>
  <path d="M50 40 Q56 56 50 72" fill="none" stroke="#ff00aa" stroke-width="1.5" opacity="0.8"/>
  <path d="M16 36 Q10 56 16 76" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.6"/>
  <path d="M48 36 Q54 56 48 76" fill="none" stroke="#00f0ff" stroke-width="1" opacity="0.6"/>

  <!-- Front armor wedge -->
  <path d="M32 8 L40 14 L42 22 L32 26 L22 22 L24 14 Z" fill="#1a2a30" stroke="#00f0ff" stroke-width="0.6"/>

  <!-- Cockpit canopy -->
  <path d="M26 28 L38 28 L40 36 L32 40 L24 36 Z" fill="#050a0e" stroke="#ff00aa" stroke-width="1"/>
  <path d="M28 30 L36 30 L37 34 L32 36 L27 34 Z" fill="#00f0ff" opacity="0.4"/>

  <!-- Central weapons spine -->
  <rect x="30" y="42" width="4" height="20" rx="1" fill="#1a2a30" stroke="#ff00aa" stroke-width="0.6"/>

  <!-- Side armor panels -->
  <path d="M16 40 L22 40 L22 64 L16 64 Z" fill="#142024" stroke="#00f0ff" stroke-width="0.5"/>
  <path d="M42 40 L48 40 L48 64 L42 64 Z" fill="#142024" stroke="#00f0ff" stroke-width="0.5"/>

  <!-- Side weapon mounts -->
  <rect x="14" y="44" width="6" height="8" rx="1" fill="#1a2a30" stroke="#ff00aa" stroke-width="0.6"/>
  <circle cx="17" cy="48" r="2" fill="#00f0ff" opacity="0.9"/>
  <rect x="44" y="44" width="6" height="8" rx="1" fill="#1a2a30" stroke="#ff00aa" stroke-width="0.6"/>
  <circle cx="47" cy="48" r="2" fill="#00f0ff" opacity="0.9"/>

  <!-- Engine exhaust grilles -->
  <rect x="24" y="72" width="6" height="4" rx="1" fill="#0a1a1e" stroke="#00f0ff" stroke-width="0.6"/>
  <rect x="34" y="72" width="6" height="4" rx="1" fill="#0a1a1e" stroke="#00f0ff" stroke-width="0.6"/>

  <!-- Rear thruster housing -->
  <path d="M22 80 L32 86 L42 80 L40 76 L32 80 L24 76 Z" fill="#1a2a30" stroke="#ff00aa" stroke-width="1"/>

  <!-- Front targeting sensors -->
  <circle cx="28" cy="18" r="1.8" fill="#ff00aa" opacity="0.9"/>
  <circle cx="36" cy="18" r="1.8" fill="#ff00aa" opacity="0.9"/>

  <!-- Side running lights -->
  <circle cx="16" cy="32" r="1.5" fill="#00f0ff" opacity="0.9"/>
  <circle cx="48" cy="32" r="1.5" fill="#00f0ff" opacity="0.9"/>

  <!-- Drift afterburner -->
  <path d="M26 86 L28 94 L30 86 Z" fill="#ff00aa" opacity="0.85"/>
  <path d="M34 86 L36 94 L38 86 Z" fill="#ff00aa" opacity="0.85"/>
</svg>
