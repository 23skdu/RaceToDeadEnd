<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 96" width="64" height="96">
  <!-- Solar Chrome: Synthwave Chrome Silver with Sunset Magenta/Orange Speed Slashes -->
  <path d="M32 4 L44 12 L48 24 L50 40 L50 64 L48 76 L44 84 L32 92 L20 84 L16 76 L14 64 L14 40 L16 24 L20 12 Z" fill="#3a4556" stroke="#ff3399" stroke-width="1.5"/>

  <!-- Chrome metallic inner hull -->
  <path d="M32 7 L42 14 L46 25 L47 64 L44 76 L32 88 L20 76 L17 64 L18 25 L22 14 Z" fill="#9aa8bc"/>
  <path d="M32 7 L38 14 L41 25 L42 64 L39 76 L32 88 L25 76 L22 64 L23 25 L26 14 Z" fill="#d0dbe8" opacity="0.6"/>

  <!-- Diagonal sunset speed-slash stripes -->
  <polygon points="18,46 47,30 48,35 17,51" fill="#ff2a85" opacity="0.9"/>
  <polygon points="17,53 48,37 48,41 17,57" fill="#ff7b00" opacity="0.9"/>
  <polygon points="17,59 48,43 48,46 17,62" fill="#ffd000" opacity="0.9"/>

  <!-- Front armor wedge -->
  <path d="M32 8 L40 14 L42 22 L32 26 L22 22 L24 14 Z" fill="#6b7a90" stroke="#ff3399" stroke-width="0.6"/>

  <!-- Cockpit canopy -->
  <path d="M26 28 L38 28 L40 36 L32 40 L24 36 Z" fill="#1b0f2e" stroke="#00f0ff" stroke-width="1"/>
  <path d="M28 30 L36 30 L37 34 L32 36 L27 34 Z" fill="#ff3399" opacity="0.5"/>

  <!-- Central weapons spine -->
  <rect x="30" y="42" width="4" height="20" rx="1" fill="#4f5b6e" stroke="#ff7b00" stroke-width="0.6"/>

  <!-- Side armor panels -->
  <path d="M16 40 L21 40 L21 64 L16 64 Z" fill="#6b7a90" stroke="#ff3399" stroke-width="0.5"/>
  <path d="M43 40 L48 40 L48 64 L43 64 Z" fill="#6b7a90" stroke="#ff3399" stroke-width="0.5"/>

  <!-- Side weapon mounts -->
  <rect x="14" y="44" width="6" height="8" rx="1" fill="#4f5b6e" stroke="#00f0ff" stroke-width="0.6"/>
  <circle cx="17" cy="48" r="2" fill="#ff3399" opacity="0.85"/>
  <rect x="44" y="44" width="6" height="8" rx="1" fill="#4f5b6e" stroke="#00f0ff" stroke-width="0.6"/>
  <circle cx="47" cy="48" r="2" fill="#ff3399" opacity="0.85"/>

  <!-- Engine exhaust grilles -->
  <rect x="24" y="72" width="6" height="4" rx="1" fill="#2a3140" stroke="#ff3399" stroke-width="0.6"/>
  <rect x="34" y="72" width="6" height="4" rx="1" fill="#2a3140" stroke="#ff3399" stroke-width="0.6"/>

  <!-- Rear thruster housing -->
  <path d="M22 80 L32 86 L42 80 L40 76 L32 80 L24 76 Z" fill="#4f5b6e" stroke="#00f0ff" stroke-width="1"/>

  <!-- Front targeting sensors -->
  <circle cx="28" cy="18" r="1.8" fill="#00f0ff" opacity="0.9"/>
  <circle cx="36" cy="18" r="1.8" fill="#00f0ff" opacity="0.9"/>

  <!-- Side running lights -->
  <circle cx="16" cy="32" r="1.5" fill="#ff3399" opacity="0.85"/>
  <circle cx="48" cy="32" r="1.5" fill="#ff3399" opacity="0.85"/>

  <!-- Exhaust flames -->
  <path d="M26 86 L28 93 L30 86 Z" fill="#ff3399" opacity="0.85"/>
  <path d="M34 86 L36 93 L38 86 Z" fill="#ff3399" opacity="0.85"/>
</svg>
